<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 50 70" role="img" aria-label="Ghana Budget Tracker logo: the Nea Onnim No Sua A, Ohu adinkra symbol inside a map of Ghana">
  <title>Ghana Budget Tracker</title>
  <!-- map of Ghana, simplified (x = (longitude + 3.3) x 10, y = (11.2 - latitude) x 10) -->
  <path fill="#e9b13a" stroke="#f6d27a" stroke-width="1" stroke-linejoin="round" d="M4.7 2 L22 2 L27 1 L31.5 0.7 L33.3 2 L36.7 9 L36.6 17 L38 22 L37 25 L39 30 L39.5 38 L38.5 42 L40.5 46 L43.5 48 L45 51 L40 54 L33 56 L31 56.5 L23 60.5 L20.5 61 L15.5 63 L12 64.6 L7 62.5 L2 61 L3.5 55 L1 49.5 L3 44 L0.6 40 L3.5 32.5 L5.5 30 L6.5 22 L5.5 18 L6 12 L3.5 6 Z"/>
  <!-- Nea Onnim No Sua A, Ohu: "he who does not know can become knowledgeable through learning".
       A diamond whose four corners each loop outward into a ring. -->
  <g fill="none" stroke="#0f3d2e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 31.5 L27.5 38 L21 44.5 L14.5 38 Z"/>
    <circle cx="21" cy="27.9" r="3.6"/>
    <circle cx="31.1" cy="38" r="3.6"/>
    <circle cx="21" cy="48.1" r="3.6"/>
    <circle cx="10.9" cy="38" r="3.6"/>
  </g>
</svg>
